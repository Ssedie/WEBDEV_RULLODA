<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Dash</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <aside>
      <div class="top">
        <div class="brand">
          <img src="images/logo.jpg" alt="logo" />
          <span>Company ABC</span>
        </div>
        <div class="menu">
          <ul>
            <li>
              <div class="nav-left">
                <img src="/images/dashboard.jpg" alt="dashboard-image">
                <a href="/">Dashboard</a>
              </div>
              <span class="arrow">&rsaquo;</span>
            </li>
            <li>
              <div class="nav-left">
                <img src="/images/product.jpg" alt="product-image">
                <a href="/">Product</a>
              </div>
              <span class="arrow">&rsaquo;</span>
            </li>
            <li>
              <div class="nav-left">
                <img src="/images/customers.jpg" alt="customer-image">
                <a href="/">Customers</a>
              </div>
              <span class="arrow">&rsaquo;</span>
            </li>
            <li>
              <div class="nav-left">
                <img src="/images/income.jpg" alt="income-picture">
                <a href="/">Income</a>
              </div>
              <span class="arrow">&rsaquo;</span>
            </li>
            <li>
              <div class="nav-left">
                <img src="/images/promote.jpg" alt="promote-image">
                <a href="/">Promote</a>
              </div>
              <span class="arrow">&rsaquo;</span>
            </li>
            <li>
              <div class="nav-left">
                <img src="/images/help.jpg" alt="help-image">
                <a href="/">Help</a>
              </div>
              <span class="arrow">&rsaquo;</span>
            </li>
          </ul>
        </div>
      </div>
      <div class="user-profile">
        <img src="/images/profpic.png" alt="profile-picture" />
        <div class="profile-info">
          <h1>Zedric</h1>
          <span>Project Manager</span>
        </div>
        <span class="arrow">&rsaquo;</span>
      </div>
    </aside>
    <main>content</main>
  </body>
</html>
